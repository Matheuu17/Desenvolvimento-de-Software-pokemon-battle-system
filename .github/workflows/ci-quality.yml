name: Java CI with JaCoCo Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # Maven se encargará solo de validar el 85% gracias al plugin del pom.xml (línea 76 )
    - name: Build, Test and Verify Quality Gate
      run: mvn clean verify
 
    - name: Upload JaCoCo Coverage Report as Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: target/site/jacoco/